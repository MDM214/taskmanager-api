# =========================================================
# TASKMANAGER - CONFIGURACION DEL PERFIL TEST
# =========================================================

spring.application.name=taskmanager-test

# Base H2 temporal en memoria
spring.datasource.url=jdbc:h2:mem:taskmanager_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el esquema para cada ejecucion de pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Evita reutilizar accidentalmente una base embebida entre contextos
spring.datasource.generate-unique-name=true

# Configuracion JWT exclusiva de pruebas
jwt.secret=clave-secreta-exclusiva-para-tests-de-taskmanager-2026
jwt.expiration=3600000